# Copy to settings.yaml and pass with:  python main.py --config config/settings.yaml
# Omitted keys fall back to the defaults in config/config.py.
# Secrets are NEVER read from this file: use env vars KITE_API_KEY / KITE_ACCESS_TOKEN.

tickers: [RELIANCE, HDFCBANK, ICICIBANK, INFY, TCS, SBIN, LT, AXISBANK, M&M, BHARTIARTL]

market:
  # Fill from NSE's trading-holiday circular for the year (ISO dates).
  holidays: []
  price_discovery_end: "09:08"
  session_open: "09:15"

data:
  provider: yfinance          # daily history: yfinance (.NS) | synthetic
  preopen_source: nse         # nse (free, unofficial) | kite | synthetic
  nse_preopen_key: ALL        # ALL | NIFTY | BANKNIFTY | FO ...
  requests_per_minute: 30

screener:
  min_price: 50
  min_avg_turnover_cr: 25     # 20-day average traded value, ₹ crore
  min_gap_pct: 1.0
  max_gap_pct: 8.0
  min_rvol: 1.5
  rsi_min: 50
  rsi_max: 80

model:
  probability_threshold: 0.55

risk:
  account_equity: 1000000     # ₹10 lakh
  risk_per_trade_pct: 0.01
  atr_stop_multiplier: 1.5
  reward_risk_ratio: 2.0
  sizing_method: fixed_fractional
  max_position_pct: 0.20
  max_open_positions: 5
  max_portfolio_heat_pct: 0.04
  est_round_trip_cost_pct: 0.0006   # set from your broker's intraday charge sheet
  # NSE price-band tick sizes (upper bound, tick). Verify against the latest NSE circular.
  tick_table: [[250, 0.01], [1000, 0.05], [5000, 0.10], [10000, 0.50], [20000, 1.00], [.inf, 5.00]]
